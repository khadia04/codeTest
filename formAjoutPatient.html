<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajouter un Patient</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<style>

body {
    background: #F8FAFC;
    font-family: 'Inter', sans-serif;
}

/* CARD */
.form-card {
    background: white;
    border-radius: 20px;
    padding: 35px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.05);
}

/* TITRE */
.form-title {
    font-weight: 700;
    color: #2563EB;
    margin-bottom: 25px;
}

/* SECTIONS */
.section-title {
    font-size: 12px;
    font-weight: 600;
    color: #64748B;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 15px;
    padding-left: 14px;
    position: relative;
}

.section-title::before {
    content: "";
    width: 3px;
    height: 14px;
    background: #2563EB;
    position: absolute;
    left: 0;
    top: 3px;
    border-radius: 2px;
}

/* INPUTS */
/* INPUTS */
.modern-input {
    border-radius: 12px;
    border: 1px solid #E2E8F0;
    padding: 9px 12px;
    font-size: 14px;
    background: #F9FAFB;
    transition: all 0.3s ease;
}

.modern-input:focus {
    border-color: #2563EB;
    background: white;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
}

/* SELECT */
.modern-select {
    border-radius: 12px;
    border: 1px solid #E2E8F0;
    font-size: 14px;
    background-color: #F9FAFB;
    padding: 9px 12px;
    transition: 0.3s;
}

.modern-select:focus {
    border-color: #2563EB;
    background: white;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
}
/* BOUTONS */
.btn-primary-modern {
    background: linear-gradient(135deg, #2563EB, #1D4ED8);
    border: none;
    border-radius: 40px;
    padding: 10px 24px;
    font-weight: 600;
    color: white;
    font-size: 14px;
    transition: 0.3s;
}

.btn-primary-modern:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 18px rgba(37,99,235,0.25);
}

.btn-outline-modern {
    border-radius: 40px;
    padding: 10px 24px;
    font-size: 14px;
}

label {
    font-weight: 500;
    margin-bottom: 6px;
    font-size: 14px;
}

</style>
</head>

<body>

<div class="container mt-4 mb-5">
    <div class="form-card">

        <h3 class="form-title">
            <i class="bi bi-person-plus"></i> Ajouter un Patient
        </h3>

        <!-- SECTION 1 -->
        <div class="section-title">Informations Personnelles</div>

        <div class="row g-3">

            <div class="col-md-3">
                <label>Identifiant</label>
                <input type="text" class="form-control modern-input" placeholder="Ex: 000125">
            </div>

            <div class="col-md-4">
                <label>Prénom(s)</label>
                <input type="text" class="form-control modern-input" placeholder="Ex: Khardiata">
            </div>

            <div class="col-md-3">
                <label>Nom</label>
                <input type="text" class="form-control modern-input" placeholder="Ex: Thiam">
            </div>

            <div class="col-md-2">
                <label>Genre</label>
                <select class="form-select modern-select">
                    <option selected disabled>Choisir</option>
                    <option value="Homme">Homme</option>
                    <option value="Femme">Femme</option>
                </select>
            </div>

        </div>

        <!-- SECTION 2 -->
        <div class="section-title mt-4">Contact & Situation</div>

        <div class="row g-3">

            <div class="col-md-3">
                <label>Téléphone</label>
                <input type="text" class="form-control modern-input" placeholder="Ex: 77 123 45 67">
            </div>

            <div class="col-md-4">
                <label>Adresse</label>
                <input type="text" class="form-control modern-input" placeholder="Ex: Dakar, Médina">
            </div>

            <div class="col-md-3">
                <label>Email</label>
                <input type="email" class="form-control modern-input" placeholder="Ex: patient@email.com">
            </div>

            <div class="col-md-2">
                <label>Profession</label>
                <input type="text" class="form-control modern-input" placeholder="Ex: Enseignant">
            </div>

        </div>

        <!-- SECTION 3 -->
        <div class="section-title mt-4">Informations Administratives</div>

        <div class="row g-3">

            <div class="col-md-3">
                <label>Numéro CIN</label>
                <input type="text" class="form-control modern-input" placeholder="Ex: 1 234 567 890">
            </div>

            <div class="col-md-3">
                <label>Nationalité</label>
                <select class="form-select modern-input">
                    <option selected disabled>Choisir</option>
                </select>
            </div>

            <div class="col-md-3">
                <label>Niveau d'Instruction</label>
                <select class="form-select modern-input">
                    <option selected disabled>Choisir</option>
                </select>
            </div>

            <div class="col-md-3">
                <label>Service Admis</label>
                <select class="form-select modern-input">
                    <option selected disabled>Choisir un service</option>
                </select>
            </div>

        </div>

        <!-- BOUTONS -->
        <div class="mt-4 d-flex gap-3">

            <button class="btn btn-primary-modern">
                <i class="bi bi-check-circle"></i> Créer le patient
            </button>

            <button class="btn btn-outline-danger btn-outline-modern">
                <i class="bi bi-x-circle"></i> Tout effacer
            </button>

        </div>

    </div>
</div>

</body>
</html>
