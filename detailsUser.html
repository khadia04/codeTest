<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        /* LAYOUT */

body{
background:#F8FAFC;
font-family:'Inter',sans-serif;
margin:0;
}

/* SIDEBAR */

.sidebar{
width:240px;
height:100vh;
position:fixed;
left:0;
top:0;
background:white;
padding:25px 20px;
border-right:1px solid #E2E8F0;
}

/* MENU */

.menu-item{
display:flex;
align-items:center;
gap:10px;
padding:10px 12px;
border-radius:10px;
text-decoration:none;
color:#334155;
margin-bottom:8px;
transition:0.2s;
}

.menu-item:hover{
background:#F1F5F9;
}

.menu-item.active{
background:linear-gradient(135deg,#2563EB,#1D4ED8);
color:white;
}

/* CONTENU */

.main-content{
margin-left:240px;
padding:40px;
}
        /* CARD */
.user-detail-card{
background:white;
border-radius:20px;
padding:30px;
box-shadow:0 15px 40px rgba(0,0,0,0.05);
}

/* AVATAR */
.avatar-lg{
width:70px;
height:70px;
border-radius:50%;
background:#DBEAFE;
color:#1D4ED8;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:600;
}

/* LABEL */
.info-label{
font-size:13px;
color:#64748B;
font-weight:600;
margin-bottom:3px;
display:block;
}

/* VALUE */
.info-value{
font-size:16px;
font-weight:500;
}

/* ROLE */
.role-specialiste{
background:#EDE9FE;
color:#6D28D9;
padding:6px 12px;
border-radius:20px;
font-size:13px;
}

.user-profile-card{
background:white;
border-radius:20px;
padding:35px;
box-shadow:0 20px 45px rgba(0,0,0,0.05);
}

/* HEADER */
.profile-header{
display:flex;
align-items:center;
gap:25px;
}

/* AVATAR */
.profile-avatar{
width:110px;
height:110px;
border-radius:50%;
object-fit:cover;
border:4px solid #F1F5F9;
}

.avatar-container{
position:relative;
}

.upload-btn{
position:absolute;
bottom:0;
right:0;
background:#2563EB;
color:white;
width:35px;
height:35px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

/* TITRE SECTION */
.section-title{
font-weight:600;
margin-bottom:20px;
color:#334155;
}

/* INFO BOX */
.info-box{
display:flex;
gap:15px;
align-items:flex-start;
background:#F8FAFC;
padding:14px;
border-radius:10px;
margin-bottom:15px;
}

.info-box i{
font-size:20px;
color:#2563EB;
}

.info-box label{
font-size:13px;
color:#64748B;
display:block;
margin-bottom:2px;
}

.info-box p{
margin:0;
font-weight:500;
}

/* ROLE BADGE */
.role-specialiste{
background:#EDE9FE;
color:#6D28D9;
padding:6px 12px;
border-radius:20px;
font-size:13px;
}

/* ACTIONS */
.profile-actions button{
width:45px;
height:45px;
border-radius:10px;
font-size:18px;
}

    </style>
</head>
<body>
