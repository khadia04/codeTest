<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>

    <style>
        .edit-card{
background:white;
padding:35px;
border-radius:18px;
box-shadow:0 20px 40px rgba(0,0,0,0.05);
}

.modern-input{
border-radius:10px;
border:1px solid #E2E8F0;
background:#F8FAFC;
padding:10px;
}

.modern-input:focus{
border-color:#2563EB;
box-shadow:0 0 0 3px rgba(37,99,235,0.1);
}

.action-bar{
margin-top:30px;
display:flex;
gap:12px;
}

.edit-container{
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 20px 45px rgba(0,0,0,0.05);
}

/* HEADER */

.edit-header{
display:flex;
align-items:center;
gap:20px;
margin-bottom:30px;
}

.avatar-upload{
position:relative;
}

.avatar{
width:70px;
height:70px;
border-radius:50%;
background:#DBEAFE;
color:#2563EB;
display:flex;
align-items:center;
justify-content:center;
font-weight:600;
font-size:22px;
}

.upload-btn{
position:absolute;
bottom:-5px;
right:-5px;
background:#2563EB;
color:white;
border:none;
border-radius:50%;
width:28px;
height:28px;
}

/* TAGS */

.patient-tags{
margin-top:5px;
display:flex;
gap:8px;
}

/* FORM */

.edit-form label{
font-weight:500;
margin-bottom:6px;
}

.modern-input{
width:100%;
border:1px solid #E2E8F0;
border-radius:10px;
padding:10px 12px;
background:#F8FAFC;
transition:0.2s;
}

.modern-input:focus{
outline:none;
border-color:#2563EB;
box-shadow:0 0 0 3px rgba(37,99,235,0.1);
}

/* ACTIONS */

.form-actions{
margin-top:30px;
display:flex;
gap:12px;
}

.save-btn{
background:#2563EB;
color:white;
border:none;
border-radius:10px;
padding:10px 20px;
}

.cancel-btn{
border-radius:10px;
}

/* ANIMATION */

.fade-in{
animation:fadeIn .4s ease;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(10px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.avatar-upload{
position:relative;
width:80px;
height:80px;
}

.avatar-label{
cursor:pointer;
display:block;
position:relative;
}

.avatar-img{
width:80px;
height:80px;
border-radius:50%;
object-fit:cover;
border:3px solid #E2E8F0;
}

.avatar-overlay{
position:absolute;
bottom:0;
right:0;
background:#2563EB;
color:white;
width:28px;
height:28px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:14px;
}

/* HEADER */

.edit-header{
display:flex;
align-items:center;
gap:25px;
margin-bottom:35px;
padding-bottom:20px;
border-bottom:1px solid #E2E8F0;
}

.patient-name{
font-weight:600;
margin-bottom:6px;
}

/* AVATAR */

.avatar-upload{
position:relative;
}

.avatar-img{
width:90px;
height:90px;
border-radius:50%;
object-fit:cover;
border:4px solid #F1F5F9;
transition:0.3s;
}

.avatar-img:hover{
transform:scale(1.05);
}

.avatar-overlay{
position:absolute;
bottom:0;
right:0;
background:#2563EB;
color:white;
width:32px;
height:32px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
box-shadow:0 5px 10px rgba(0,0,0,0.1);
}

/* TAGS */

.tag{
padding:5px 12px;
border-radius:8px;
font-size:13px;
font-weight:500;
}

.tag-blue{
background:#DBEAFE;
color:#1D4ED8;
}

.tag-cyan{
background:#CFFAFE;
color:#0891B2;
}

.tag-gray{
background:#E5E7EB;
color:#374151;
}

/* INPUTS */

.modern-input{
width:100%;
border:1px solid #E2E8F0;
border-radius:10px;
padding:11px 14px;
background:#F8FAFC;
transition:all 0.25s ease;
}

.modern-input:focus{
border-color:#2563EB;
background:white;
box-shadow:0 0 0 3px rgba(37,99,235,0.12);
}

/* FORM LABEL */

.edit-form label{
font-size:14px;
font-weight:500;
color:#334155;
}

/* BUTTONS */

.save-btn{
background:linear-gradient(135deg,#2563EB,#1D4ED8);
color:white;
border:none;
padding:10px 22px;
border-radius:10px;
font-weight:500;
transition:0.25s;
}

.save-btn:hover{
transform:translateY(-2px);
box-shadow:0 8px 18px rgba(37,99,235,0.25);
}

.cancel-btn{
background:#F1F5F9;
border:none;
padding:10px 20px;
border-radius:10px;
}

.cancel-btn:hover{
background:#E2E8F0;
}

/* CARD */

.edit-container{
background:white;
padding:45px;
border-radius:20px;
box-shadow:0 25px 60px rgba(0,0,0,0.05);
}

.edit-form .col-md-6{
transition:0.2s;
}

.edit-form .col-md-6:hover{
transform:translateY(-2px);
}
    </style>
</head>
<body>
    <!-- SIDEBAR -->

<div class="sidebar">

<h4 class="text-primary mb-4">
<i class="bi bi-hospital"></i> Admin
</h4>

<i class="bi bi-box-arrow-right"></i> Déconnexion
</a>

</div>

<div class="main-content fade-in">

<div class="edit-container">

<!-- HEADER -->

<div class="edit-header">

<div class="avatar-upload">

<label for="photoInput" class="avatar-label">

<img id="avatarPreview"
src="https://i.pravatar.cc/150?img=12"
class="avatar-img">

<div class="avatar-overlay">
<i class="bi bi-camera-fill"></i>
</div>

</label>

<input type="file" id="photoInput" accept="image/*" hidden>

</div>

<div class="patient-info">

<h3 class="patient-name">Isseu Diop</h3>

<div class="patient-tags">
<span class="tag tag-blue">ID : 150000</span>
<span class="tag tag-cyan">26 ans</span>
<span class="tag tag-gray">Féminin</span>
</div>

</div>

</div>


<!-- FORM -->

<form class="edit-form">

<div class="row g-4">

<div class="col-md-6">
<label>Prénom</label>
<input type="text" class="form-control modern-input" id="prenom" value="Isseu" required>
<div class="invalid-feedback">
Veuillez entrer un prénom
</div>
</div>


<div class="col-md-6">
<label>Nom</label>
<input type="text" class="modern-input" value="Diop">
</div>

<div class="col-md-6">
<label>Date de naissance</label>
<input type="date" class="modern-input">
</div>

<div class="col-md-6">
<label>Genre</label>
<select class="modern-input">
<option>Féminin</option>
<option>Masculin</option>
</select>
</div>

<div class="col-md-6">
<label>Téléphone</label>
<input type="text" class="modern-input" value="776788789">
</div>

<div class="col-md-6">
<label>Email</label>
<input type="email" class="modern-input">
</div>

<div class="col-md-6">
<label>Adresse</label>
<input type="text" class="modern-input" value="PA U 16">
</div>

<div class="col-md-6">
<label>Profession</label>
<input type="text" class="modern-input">
</div>

</div>


<!-- ACTIONS -->

<div class="form-actions">

<button class="btn btn-light cancel-btn">
<i class="bi bi-arrow-left"></i> Annuler
</button>

<button class="btn save-btn">
<i class="bi bi-check-circle"></i> Enregistrer
</button>

</div>

</form>

</div>

</div>


<script>

const photoInput = document.getElementById("photoInput");
const avatarPreview = document.getElementById("avatarPreview");

photoInput.addEventListener("change", function(){

const file = this.files[0];

if(file){

const reader = new FileReader();

reader.onload = function(e){
avatarPreview.src = e.target.result;
}

reader.readAsDataURL(file);

}

});

</script>
